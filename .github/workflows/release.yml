name: Automated Semantic Release

on:
  push:
    branches:
      - master
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Optional explicit SemVer tag (e.g. v5.1.0). Leave empty to auto-compute from Conventional Commits."
        required: false
        type: string
      prerelease:
        description: "Mark GitHub Release as a pre-release"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  plan-and-verify:
    name: Compute SemVer & Verify Release Artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      should_release: ${{ steps.version.outputs.should_release }}
      release_tag: ${{ steps.version.outputs.release_tag }}
      previous_tag: ${{ steps.version.outputs.previous_tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Compute Next Semantic Version
        id: version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          node -e '
            const { execFileSync } = require("node:child_process");
            const fs = require("node:fs");

            const env = process.env;
            const outFile = env.GITHUB_OUTPUT;
            const writeOut = (k, v) => fs.appendFileSync(outFile, `${k}=${v}\n`);

            const git = (...args) =>
              execFileSync("git", args, { encoding: "utf8" }).trim();

            const tagsRaw = git("tag", "--list", "v*.*.*", "--sort=-v:refname");
            const tags = tagsRaw ? tagsRaw.split(/\r?\n/).filter(Boolean) : [];
            const semverRe = /^v(\d+)\.(\d+)\.(\d+)(-[0-9A-Za-z.-]+)?$/;

            let releaseTag = "";
            let previousTag = tags[0] || "";
            let shouldRelease = false;
            let prerelease = env.INPUT_PRERELEASE === "true";

            if (env.REF_TYPE === "tag" && semverRe.test(env.REF_NAME)) {
              releaseTag = env.REF_NAME;
              previousTag = tags.find((t) => t !== releaseTag) || "";
              shouldRelease = true;
              if (releaseTag.includes("-")) prerelease = true;
            } else if (env.EVENT_NAME === "workflow_dispatch" && env.INPUT_VERSION) {
              const candidate = env.INPUT_VERSION.trim();
              if (!semverRe.test(candidate)) {
                console.error(`::error::Invalid SemVer tag input: "${candidate}". Expected vMAJOR.MINOR.PATCH`);
                process.exit(1);
              }
              releaseTag = candidate;
              shouldRelease = true;
              if (releaseTag.includes("-")) prerelease = true;
            } else {
              if (!previousTag) {
                releaseTag = "v5.0.0";
                shouldRelease = true;
              } else {
                const headOnTag = git("tag", "--points-at", "HEAD", "--list", "v*.*.*");
                if (headOnTag) {
                  console.log(`HEAD is already tagged (${headOnTag}); skipping auto-release.`);
                  shouldRelease = false;
                } else {
                  const logText = git("log", `${previousTag}..HEAD`, "--pretty=format:%s%n%b%n---END---");
                  const commits = logText.split("---END---").map((s) => s.trim()).filter(Boolean);
                  let bump = null;
                  for (const msg of commits) {
                    const subject = msg.split(/\r?\n/)[0] || "";
                    if (/BREAKING CHANGE:/i.test(msg) || /^[a-z]+(\([^)]+\))?!:/.test(subject)) {
                      bump = "major";
                      break;
                    }
                    if (/^feat(\([^)]+\))?:/.test(subject)) {
                      bump = bump === "major" ? "major" : "minor";
                    } else if (/^(fix|perf|refactor|revert)(\([^)]+\))?:/.test(subject)) {
                      bump = bump || "patch";
                    }
                  }
                  if (!bump) {
                    console.log(`No releasable commits since ${previousTag}; skipping auto-release.`);
                    shouldRelease = false;
                  } else {
                    const m = previousTag.match(semverRe);
                    let major = Number(m[1]);
                    let minor = Number(m[2]);
                    let patch = Number(m[3]);
                    if (bump === "major") { major += 1; minor = 0; patch = 0; }
                    else if (bump === "minor") { minor += 1; patch = 0; }
                    else { patch += 1; }
                    releaseTag = `v${major}.${minor}.${patch}`;
                    shouldRelease = true;
                  }
                }
              }
            }

            console.log(JSON.stringify({ shouldRelease, releaseTag, previousTag, prerelease }, null, 2));
            writeOut("should_release", String(shouldRelease));
            writeOut("release_tag", releaseTag);
            writeOut("previous_tag", previousTag);
            writeOut("prerelease", String(prerelease));
          '

      - name: Verify Build & Policy Gates Before Release
        if: steps.version.outputs.should_release == 'true'
        run: |
          npm ci
          npm run lint
          npm test
          node scripts/ci-policy-guard.mjs
          npm run build

      - name: Generate Release Manifest & SHA-256 Checksums
        if: steps.version.outputs.should_release == 'true'
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
          PREVIOUS_TAG: ${{ steps.version.outputs.previous_tag }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p release-metadata

          {
            find dist -type f | sort | xargs -r sha256sum
            for f in api/ssr-shell.html api/index.ts; do
              if [ -f "$f" ]; then sha256sum "$f"; fi
            done
          } > release-metadata/SHA256SUMS.txt

          node -e '
            const fs = require("node:fs");
            const crypto = require("node:crypto");
            const sums = fs.readFileSync("release-metadata/SHA256SUMS.txt", "utf8");
            const manifest = {
              name: "TallyNX Web",
              repository: process.env.GITHUB_REPOSITORY,
              tag: process.env.RELEASE_TAG,
              previousTag: process.env.PREVIOUS_TAG || null,
              commit: process.env.COMMIT_SHA,
              nodeVersion: process.version,
              fileCount: sums.trim().split(/\r?\n/).filter(Boolean).length,
              checksumsSha256: crypto.createHash("sha256").update(sums).digest("hex"),
              generatedAt: new Date().toISOString(),
            };
            fs.writeFileSync("release-metadata/release-manifest.json", JSON.stringify(manifest, null, 2) + "\n");
            console.log(JSON.stringify(manifest, null, 2));
          '

      - name: Upload Release Metadata Artifact
        if: steps.version.outputs.should_release == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: release-metadata-${{ steps.version.outputs.release_tag }}
          path: release-metadata/
          retention-days: 7

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [plan-and-verify]
    if: needs.plan-and-verify.outputs.should_release == 'true'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download Release Metadata Artifact
        uses: actions/download-artifact@v8
        with:
          name: release-metadata-${{ needs.plan-and-verify.outputs.release_tag }}
          path: release-metadata

      - name: Create or Update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.plan-and-verify.outputs.release_tag }}
          PREVIOUS_TAG: ${{ needs.plan-and-verify.outputs.previous_tag }}
          PRERELEASE: ${{ needs.plan-and-verify.outputs.prerelease }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release ${RELEASE_TAG} already exists; uploading updated checksum metadata."
            gh release upload "$RELEASE_TAG" \
              release-metadata/release-manifest.json \
              release-metadata/SHA256SUMS.txt \
              --clobber
          else
            ARGS=(
              release create "$RELEASE_TAG"
              release-metadata/release-manifest.json
              release-metadata/SHA256SUMS.txt
              --target "$COMMIT_SHA"
              --title "TallyNX Web ${RELEASE_TAG}"
              --generate-notes
            )
            if [ -n "${PREVIOUS_TAG:-}" ]; then
              ARGS+=(--notes-start-tag "$PREVIOUS_TAG")
            fi
            if [ "$PRERELEASE" = "true" ]; then
              ARGS+=(--prerelease)
            fi
            gh "${ARGS[@]}"
          fi

          echo "### Published Release ${RELEASE_TAG}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Tag:** \`${RELEASE_TAG}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Commit:** \`${COMMIT_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Assets:** \`release-manifest.json\`, \`SHA256SUMS.txt\`" >> "$GITHUB_STEP_SUMMARY"
